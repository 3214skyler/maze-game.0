name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.10", "3.12"] }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pg }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MAZE_TEST_PG_DSN: "dbname=postgres user=postgres password=pg host=localhost"
      KIVY_NO_ARGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libmtdev1
      - run: pip install -r requirements.txt psycopg2-binary
      - run: xvfb-run -a python -m pytest -v
      - name: Daily-challenge tests for every maze size (Monday 10x10 ... Sunday 22x22)
        run: |
          for shift in 1 2 3 4 5 6; do
            MAZE_TEST_MAZE_SHIFT=$shift xvfb-run -a python -m pytest -q \
              tests/test_backend_sql.py tests/test_online_e2e.py tests/test_online_ui.py tests/test_check_online.py
          done
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pg }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MAZE_TEST_PG_DSN: "dbname=postgres user=postgres password=pg host=localhost"
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install psycopg2-binary    # the HTTP end-to-end tests talk to the real SQL through the Python fake Supabase
      - run: npm ci
      - run: npm run typecheck
      - run: npm test                       # unit + HTTP end-to-end tests (real PostgreSQL)
      - run: npm run build

  web-browser:
    runs-on: ubuntu-latest
    continue-on-error: true                 # real-Chromium smoke test: informative, does not block merges
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pg }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MAZE_TEST_PG_DSN: "dbname=postgres user=postgres password=pg host=localhost"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install psycopg2-binary
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: web/e2e-browser
      - run: npm run e2e
        working-directory: web/e2e-browser

