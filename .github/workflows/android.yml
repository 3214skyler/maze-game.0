name: Build Android APK
on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: System packages
  run: |
    sudo apt-get update
    sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev \
      libncurses-dev cmake libffi-dev libssl-dev build-essential ccache
      - run: pip install buildozer "cython<3" virtualenv
      - name: Accept Android SDK licenses
        run: yes | buildozer android update sdk --all
      - name: Online configuration (public values only)
        env:
          URL: ${{ secrets.MAZE_SUPABASE_URL }}
          KEY: ${{ secrets.MAZE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            python -c "import json,os; json.dump({'url': os.environ['URL'], 'anon_key': os.environ['KEY']}, open('config/online.json','w'))"
            echo "online.json created"
          else
            echo "::warning::MAZE_SUPABASE_URL / MAZE_SUPABASE_ANON_KEY secrets missing: the APK will be guest-only"
          fi
      - uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-
      - run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: mazegame-debug-apk
          path: bin/*.apk
